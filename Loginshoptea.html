<!DOCTYPE html>
<html>
<head>
    <title>ShopTea - Login</title>
</head>

<body style="
    margin: 0;
    min-height: 100vh;
    background-image: url('background.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    font-family: Arial, sans-serif;
">

    <!-- LOGIN CARD -->
    <div style="
        text-align: center;
        background: rgba(255,255,255,0.92);
        padding: 35px;
        width: 400px;
        margin: 70px auto;
        border-radius: 25px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    ">

        <!-- SHOPTEA LOGO -->
        <img src="shoptea-logo.png"
             alt="ShopTea Logo"
             style="
                width: 140px;
                height: 100px;
                object-fit: contain;
             ">

        <!-- SHOPTEA NAME -->
        <h1 style="
            margin: 5px 0;
            font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
            font-size: 42px;
            color: #6F4E37;
        ">
            ShopTea
        </h1>

        <p style="
            color: #8B5E3C;
            font-size: 16px;
            margin-top: 5px;
        ">
            Sip. Shop. Enjoy.
        </p>

        <!-- LOGIN TITLE -->
        <h2 style="
            color: #6F4E37;
            font-size: 28px;
            margin-top: 25px;
        ">
            Welcome Back!
        </h2>

        <p style="
            color: #555;
            font-size: 14px;
        ">
            Login to continue shopping at ShopTea.
        </p>

        <!-- USERNAME -->
        <label style="
            font-weight: bold;
            color: #6F4E37;
        ">
            Username or Email
        </label>

        <br>

        <input type="text"
               placeholder="Enter your username or email"
               style="
                    padding: 12px;
                    width: 270px;
                    border: 1px solid #C8B6A6;
                    border-radius: 8px;
                    margin-top: 8px;
                    font-size: 14px;
               ">

        <br><br>

        <!-- PASSWORD -->
        <label style="
            font-weight: bold;
            color: #6F4E37;
        ">
            Password
        </label>

        <br>

        <input type="password"
               placeholder="Enter your password"
               style="
                    padding: 12px;
                    width: 270px;
                    border: 1px solid #C8B6A6;
                    border-radius: 8px;
                    margin-top: 8px;
                    font-size: 14px;
               ">

        <br><br>

        <!-- REMEMBER ME -->
        <label style="
            font-size: 14px;
            color: #555;
        ">
            <input type="checkbox">
            Remember me
        </label>

        <br><br>

        <!-- LOGIN BUTTON -->
        <button onclick="window.location.href='Frame.html'"
                style="
                    padding: 13px 45px;
                    background-color: #8B5E3C;
                    color: white;
                    border: none;
                    border-radius: 8px;
                    font-size: 16px;
                    cursor: pointer;
                ">
            Login
        </button>

        <br><br>

        <!-- SIGN UP -->
        <p style="
            font-size: 14px;
            color: #555;
        ">
            Don't have an account?

            <a href="signup.html"
               style="
                    color: #8B5E3C;
                    font-weight: bold;
                    text-decoration: none;
               ">
                Sign Up
            </a>
        </p>

        <!-- FORGOT PASSWORD -->
        <a href="#"
           style="
                color: #8B5E3C;
                font-size: 14px;
                text-decoration: none;
           ">
            Forgot Password?
        </a>

    </div>

</body>
</html>
