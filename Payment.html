<!DOCTYPE html>
<html>

<head>
    <title>SHOPTEA - Payment</title>

    <style>
        body {
            background-image: url("cafe1.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            color: rgb(248, 195, 60);
        }

        button {
            background-color: #6F4E37;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<center>

<h1>SHOPTEA - MODE OF PAYMENT</h1>

<hr>

<h2>SELECT YOUR PAYMENT METHOD</h2>

<form>

<table border="2" width="500">

    <tr>
        <th>PAYMENT METHOD</th>
        <th>SELECT</th>
    </tr>

    <tr>
        <td>Cash on Delivery</td>

        <td align="center">
            <input type="radio"
                   name="payment"
                   value="Cash on Delivery">
        </td>
    </tr>

    <tr>
        <td>GCash</td>

        <td align="center">
            <input type="radio"
                   name="payment"
                   value="GCash">
        </td>
    </tr>

    <tr>
        <td>Bank Transfer</td>

        <td align="center">
            <input type="radio"
                   name="payment"
                   value="Bank Transfer">
        </td>
    </tr>

</table>

<br>

<h2>CUSTOMER INFORMATION</h2>

<p>
    Name:
    <br>
    <input type="text" name="name">
</p>

<p>
    Address:
    <br>
    <input type="text" name="address">
</p>

<p>
    Contact Number:
    <br>
    <input type="text" name="contact">
</p>

<br>

<input style="background-color: #6F4E37; color: antiquewhite;" type="submit" value="PLACE ORDER">

</form>

<br>

<a href="Cart.html">
    <button>BACK TO CART</button>
</a>

<hr>

<footer>
    <p>&copy; 2026 SHOPTEA. All rights reserved.</p>
</footer>

</center>

</body>
</html>
